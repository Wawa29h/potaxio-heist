<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#070b16">
<title>Heist Remote</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--ink:#e9eefb;--muted:#9aa7c7;--gold:#ffc83d;--red:#ff3b4a;--green:#39ff88}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;overscroll-behavior:none;user-select:none}
body{display:flex;flex-direction:column;padding:16px;gap:14px;height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;font-family:'Special Elite',monospace;font-size:.8rem;letter-spacing:.15em;color:var(--muted)}
.status{display:flex;align-items:center;gap:6px}
.status::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--red)}
.status.on::before{background:var(--green)}
.now{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px}
.chap{font-family:'Special Elite',monospace;color:var(--gold);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase}
.ttl{font-family:'Bebas Neue',Impact,sans-serif;font-size:2.2rem;line-height:1;margin-top:4px}
.meta{display:flex;justify-content:space-between;margin-top:8px;font-size:.85rem;color:var(--muted)}
.bar{height:4px;background:rgba(255,255,255,.1);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.big{flex:1;display:grid;grid-template-rows:1fr auto;gap:12px;min-height:0}
button{font:inherit;border:0;border-radius:18px;color:var(--ink);cursor:pointer;transition:transform .08s,filter .2s}
button:active{transform:scale(.97);filter:brightness(1.3)}
#next{background:linear-gradient(160deg,var(--gold),#ff9d00);color:#1a1200;font-family:'Bebas Neue',Impact,sans-serif;font-size:3rem;letter-spacing:.05em}
#prev{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:18px;font-weight:800}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:16px 10px;font-weight:700;font-size:.95rem}
#act{background:rgba(57,255,136,.12);border-color:var(--green);color:var(--green)}
#act:disabled{opacity:.3}
#pv.on{background:var(--gold);color:#1a1200;border-color:var(--gold)}
</style>
</head>
<body>
<header><span>HEIST REMOTE</span><span class="status" id="status">offline</span></header>

<div class="now">
  <div class="chap" id="chap">—</div>
  <div class="ttl" id="ttl">Connecting…</div>
  <div class="meta"><span id="num">– / –</span><span id="frag"></span></div>
  <div class="bar"><i id="bar"></i></div>
</div>

<div class="big">
  <button id="next">NEXT ›</button>
  <button id="prev">‹ Back</button>
</div>
<div class="row">
  <button id="act" disabled>Action</button>
  <button id="pv">Passive voice</button>
</div>

<script>
const $=id=>document.getElementById(id);
// #topic in the URL → internet mode through the ntfy.sh relay; otherwise local server.js
const RELAY='https://ntfy.sh/';
const topic=decodeURIComponent(location.hash.slice(1));
let send,es;
if(topic){
  send=c=>fetch(RELAY+topic,{method:'POST',body:'c:'+c}).catch(()=>{});
  es=new EventSource(RELAY+topic+'/sse');
  es.onmessage=e=>{const m=JSON.parse(e.data).message||'';if(m.startsWith('s:'))render(JSON.parse(m.slice(2)))};
}else{
  send=c=>fetch('/cmd',{method:'POST',body:JSON.stringify({c})}).catch(()=>{});
  es=new EventSource('/events');
  es.addEventListener('state',e=>render(JSON.parse(e.data)));
}
function tap(c){send(c);navigator.vibrate?.(15)}
$('next').onclick=()=>tap('next');
$('prev').onclick=()=>tap('prev');
$('act').onclick=()=>tap('action');
$('pv').onclick=()=>tap('pv');

es.onopen=()=>{$('status').textContent='live';$('status').classList.add('on');if(topic)send('hello')};
es.onerror=()=>{$('status').textContent='offline';$('status').classList.remove('on')};
function render(s){
  $('chap').textContent=s.chapter||'';
  $('ttl').textContent=s.title||'';
  $('num').textContent=`Slide ${s.i+1} / ${s.n}`;
  $('frag').textContent=s.fragTotal?`Text ${s.fragShown}/${s.fragTotal}`:'';
  $('bar').style.width=((s.i+1)/s.n*100)+'%';
  $('act').disabled=!s.action;
  $('act').textContent=s.action||'Action';
  $('pv').classList.toggle('on',!!s.pv);
}
</script>
</body>
</html>
